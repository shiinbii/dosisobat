services:
  postgres:
    image: postgres:16-alpine
    container_name: dosis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dosis_obat
      POSTGRES_USER: dosis
      POSTGRES_PASSWORD: dosis_dev_password
    ports:
      - "5432:5432"
    volumes:
      - dosis_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dosis -d dosis_obat"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dosis_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dosis:dosis_dev_password@postgres:5432/dosis_obat
      JWT_SECRET: change-me-in-production
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  dosis_pg_data:
